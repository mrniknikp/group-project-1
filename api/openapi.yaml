openapi: 3.1.0

info:
  title: Team Service API
  version: 2.4.0
  summary: Контракт сервиса команды — заявки, котировки, уведомления и баллы.
  description: |
    Направленный контракт «портал → сервис команды» (exchange profile v2.4.0).
    id маршрута и плеча — id сегмента из справочника (`<mode>:<from>-<to>`,
    например `road:moscow-tula`); `leg_ids` — упорядоченная цепочка 1–3
    сегментов от `origin` до `destination`, `route_id` — её первый сегмент.
    Необязательные `max_price_rub`/`max_duration_hours` — потолки заявки:
    сервис обязан принимать их и не отвечать `422` на незнакомые
    необязательные поля; котировка выше потолка порталом не допускается.
    Команда только котирует; доставку выполняет система, а `status`,
    `delivered_at`, `failed_at`, `failure_code` помечены `readOnly`. Валюта —
    целые рубли (`price_rub`), время — UTC ISO 8601, авторизация — `X-Api-Key`,
    ошибки — единый конверт `{"code","message","details"}`.
    `POST /v1/orders/{order_id}/notify` принимает четыре типа событий:
    `order_won` (заявка выиграна), экспериментальный `order_lost` (заявка
    закрыта без победы) и системные `delivered`/`subcontract_delivered`.
  contact:
    name: Организаторы группового проекта
    url: https://git.codenotes.ru/tasks/group-project-1
externalDocs:
  description: README контракта, примеров и моков
  url: https://git.codenotes.ru/tasks/group-project-1/src/branch/main/api/README.md

servers:
  - url: http://localhost:8080

tags:
  - {name: System, description: Проверка живости и готовности.}
  - {name: Requests, description: Приём RFQ и список заявок команде.}
  - {name: Quotes, description: Котировки команды по заявке.}
  - {name: Orders, description: Read-only снимок заказа и уведомление о доставке.}
  - {name: Points, description: Баллы команды (read-only).}

security:
  - ApiKeyAuth: []

paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealth
      summary: Проверить доступность сервиса
      description: 'Без ключа API и секретов: `200` — готов, `503` — не готов.'
      security: []
      responses:
        '200':
          description: Сервис доступен.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
              examples:
                ok:
                  value: {status: ok, service: team-service, version: '2.4.0', time: '2026-11-17T06:40:00Z'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /v1/requests:
    get:
      tags: [Requests]
      operationId: listRequests
      summary: Заявки, переданные команде
      description: 'Read-only список заявок команды без пагинации; пустой список легитимен.'
      responses:
        '200':
          description: Заявки команды.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Request'}
              examples:
                list:
                  value:
                    - request_id: req_5001
                      origin: moscow
                      destination: kazan
                      allowed_modes: [rail, road]
                      weight_t: 18.5
                      cargo:
                        description: Сборный груз, паллеты.
                        cargo_type: general
                      response_deadline: '2026-11-19T18:00:00Z'
                      points_reward: 100
                      route_hints:
                        - route_id: road:moscow-kazan
                          leg_ids: [road:moscow-kazan]
                      comment: Погрузка на терминале заказчика.
                      received_at: '2026-11-17T06:41:00Z'
                      status: open
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

    post:
      tags: [Requests]
      operationId: createRequest
      summary: Принять заявку (RFQ) от портала
      description: |
        `Idempotency-Key` = `<request_id>:<team_slug>` обязателен: повтор с тем
        же ключом и телом — `200` и та же заявка, другое тело — `409`. Заявка —
        входящий документ, а не заказ; `route_hints` — подсказка, не разрешение.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Request'}
            examples:
              rfq:
                value:
                  request_id: req_5001
                  origin: moscow
                  destination: kazan
                  allowed_modes: [rail, road]
                  weight_t: 18.5
                  cargo:
                    description: Сборный груз, паллеты.
                    cargo_type: general
                  response_deadline: '2026-11-19T18:00:00Z'
                  points_reward: 100
                  route_hints:
                    - route_id: road:moscow-kazan
                      leg_ids: [road:moscow-kazan]
                  comment: Погрузка на терминале заказчика.
      responses:
        '201':
          description: Заявка создана.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Request'}
              examples:
                created:
                  value:
                    request_id: req_5001
                    origin: moscow
                    destination: vladivostok
                    allowed_modes: [rail, road]
                    weight_t: 18.5
                    cargo:
                      description: Сборный груз, паллеты.
                      cargo_type: general
                    response_deadline: '2026-11-19T18:00:00Z'
                    points_reward: 100
                    route_hints:
                      - route_id: road:moscow-kazan
                        leg_ids: [road:moscow-kazan]
                    comment: Погрузка на терминале заказчика.
                    received_at: '2026-11-17T06:41:00Z'
                    status: open
        '200':
          description: Повтор с тем же `Idempotency-Key` и телом.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Request'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /v1/requests/{request_id}/quotes:
    get:
      tags: [Quotes]
      operationId: listQuotes
      summary: Котировки команды по заявке
      description: |
        Только свои котировки по заявке: до трёх вариантов одного набора;
        пустой список легитимен.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Котировки команды.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Quote'}
              examples:
                list:
                  value:
                    - quote_id: quo_7011
                      request_id: req_5001
                      variant: cheapest
                      status: submitted
                      price_rub: 1950000
                      duration_hours: 210
                      route_id: road:moscow-kazan
                      leg_ids: [road:moscow-kazan]
                      valid_until: '2026-11-20T18:00:00Z'
                      received_seq: 1008
                      received_at: '2026-11-17T09:00:00Z'
                      comment: Авто, прямой рейс.
                    - quote_id: quo_7009
                      request_id: req_5001
                      variant: fastest
                      status: submitted
                      price_rub: 2140000
                      duration_hours: 168
                      route_id: road:moscow-kazan
                      leg_ids: [road:moscow-kazan]
                      valid_until: '2026-11-20T18:00:00Z'
                      received_seq: 1009
                      received_at: '2026-11-17T09:00:00Z'
                      comment: Ж/д, быстрее по графику.
                    - quote_id: quo_7010
                      request_id: req_5001
                      variant: balanced
                      status: submitted
                      price_rub: 2020000
                      duration_hours: 190
                      route_id: road:moscow-kazan
                      leg_ids: [road:moscow-kazan]
                      valid_until: '2026-11-20T18:00:00Z'
                      received_seq: 1010
                      received_at: '2026-11-17T09:00:00Z'
                      comment: Авто, сбалансированный вариант.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

    post:
      tags: [Quotes]
      operationId: createQuote
      summary: Опубликовать набор котировок команды (до трёх вариантов)
      description: |
        Тело — от одного до трёх вариантов: `variant` и `quote_id` уникальны
        внутри набора. `valid_until` каждого варианта — RFC 3339, не раньше
        `response_deadline + 60 s`. Один активный набор на команду и заявку:
        повтор публикации — `409 quote_exists`, после дедлайна —
        `409 request_closed`. `status`, `received_seq` и `received_at`
        присваивает сервер; у каждого варианта свой `received_seq`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuoteBatchInput'}
            examples:
              batch:
                value:
                  variants:
                    - quote_id: quo_7011
                      variant: cheapest
                      price_rub: 1950000
                      duration_hours: 210
                      route_id: road:moscow-kazan
                      leg_ids: [road:moscow-kazan]
                      valid_until: '2026-11-20T18:00:00Z'
                      comment: Авто, прямой рейс.
                    - quote_id: quo_7009
                      variant: fastest
                      price_rub: 2140000
                      duration_hours: 168
                      route_id: road:moscow-kazan
                      leg_ids: [road:moscow-kazan]
                      valid_until: '2026-11-20T18:00:00Z'
                      comment: Ж/д, быстрее по графику.
                    - quote_id: quo_7010
                      variant: balanced
                      price_rub: 2020000
                      duration_hours: 190
                      route_id: road:moscow-kazan
                      leg_ids: [road:moscow-kazan]
                      valid_until: '2026-11-20T18:00:00Z'
                      comment: Авто, сбалансированный вариант.
      responses:
        '201':
          description: Набор котировок создан.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuoteBatch'}
              examples:
                created:
                  value:
                    request_id: req_5001
                    variants:
                      - quote_id: quo_7011
                        request_id: req_5001
                        variant: cheapest
                        status: submitted
                        price_rub: 1950000
                        duration_hours: 210
                        route_id: road:moscow-kazan
                        leg_ids: [road:moscow-kazan]
                        valid_until: '2026-11-20T18:00:00Z'
                        received_seq: 1008
                        received_at: '2026-11-17T09:00:00Z'
                        comment: Авто, прямой рейс.
                      - quote_id: quo_7009
                        request_id: req_5001
                        variant: fastest
                        status: submitted
                        price_rub: 2140000
                        duration_hours: 168
                        route_id: road:moscow-kazan
                        leg_ids: [road:moscow-kazan]
                        valid_until: '2026-11-20T18:00:00Z'
                        received_seq: 1009
                        received_at: '2026-11-17T09:00:00Z'
                        comment: Ж/д, быстрее по графику.
                      - quote_id: quo_7010
                        request_id: req_5001
                        variant: balanced
                        status: submitted
                        price_rub: 2020000
                        duration_hours: 190
                        route_id: road:moscow-kazan
                        leg_ids: [road:moscow-kazan]
                        valid_until: '2026-11-20T18:00:00Z'
                        received_seq: 1010
                        received_at: '2026-11-17T09:00:00Z'
                        comment: Авто, сбалансированный вариант.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /v1/orders/{order_id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Read-only снимок заказа
      description: |
        `status`, `delivered_at`, `failed_at`, `failure_code` и `points_awarded` —
        системные и `readOnly`; команда их не меняет.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Снимок заказа.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderSnapshot'}
              examples:
                delivered:
                  value:
                    order_id: ord_6003
                    request_id: req_5003
                    quote_id: quo_7003
                    route_id: road:kazan-izhevsk
                    status: delivered
                    price_rub: 61000
                    created_at: '2026-11-15T11:00:00Z'
                    delivered_at: '2026-11-17T03:40:00Z'
                    points_awarded: 100
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /v1/orders/{order_id}/notify:
    post:
      tags: [Orders]
      operationId: notifyOrder
      summary: Уведомить команду о победе в заявке или о системной доставке
      description: |
        Одна ручка, четыре типа событий; тип различается телом запроса.

        **`order_won`** — команда выиграла заявку. Это уведомление о выборе, а
        не о доставке: заказ в этот момент ещё `confirmed`, его снимок придёт
        событиями доставки. `order_id` сервису может быть ещё неизвестен,
        поэтому `404` на это событие не требуется.

        **`order_lost`** (экспериментально) — заявка закрыта без победы
        команды: `reason` = `not_selected` (котировка подана, выбрали другую) или
        `no_quote` (RFQ получен, котировка не подана). Это событие не входит в
        базовый контракт: портал может выключить его без изменения контракта, а
        сервис обязан ответить `204` и не падать, если событие не приходит.

        **`delivered` / `subcontract_delivered`** — системный факт доставки:
        `delivered` — заказ доставлен, `subcontract_delivered` — доставлено
        чужое плечо за баллы. `delivered_at` и `points_awarded` фиксирует
        система; полей смены статуса, отмены или подтверждения нет.

        Ответы одинаковы для всех событий: `204` — принято, в том числе
        идемпотентный повтор; `409 notification_conflict` — уже обработано
        (для портала это успех, награда не откатывается); `404`/`405`/`501` —
        ручка не поддерживается: портал помечает доставку `failed`, но выбор,
        заказ и резерв не откатываются; битое тело — `422`.

        `Idempotency-Key` — необязательный заголовок, но для `order_won` и
        `order_lost` портал передаёт его **всегда**, и сервис обязан трактовать
        эти события идемпотентно по ключу: повтор с тем же ключом и телом —
        `204`, другое тело с тем же ключом — `409`. Ключи:
        `exchange:order:<order_id>:won:v1` и
        `exchange:order:<order_id>:lost:<team_id>:v1`. Для событий доставки
        идемпотентность прежняя — по паре `(order_id, subcontract_id)`.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/NotifyIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/OrderNotification'
                - $ref: '#/components/schemas/OrderWonNotification'
                - $ref: '#/components/schemas/OrderLostNotification'
            examples:
              delivered:
                value:
                  order_id: ord_6003
                  status: delivered
                  delivered_at: '2026-11-17T03:40:00Z'
                  route_id: road:kazan-izhevsk
                  leg_ids: [road:kazan-izhevsk, road:izhevsk-perm, road:perm-yekaterinburg]
                  points_awarded: 100
              subcontract_delivered:
                value:
                  order_id: ord_6002
                  subcontract_id: sub_9001
                  status: subcontract_delivered
                  delivered_at: '2026-11-17T09:00:00Z'
                  route_id: rail:saint-petersburg-arkhangelsk
                  leg_ids: [rail:saint-petersburg-arkhangelsk]
                  points_awarded: 40
              order_won:
                value:
                  event: order_won
                  order_id: ord_6001
                  request_id: req_5001
                  team_id: team-1
                  route_id: road:moscow-kazan
                  leg_ids: [road:moscow-kazan]
                  price_rub: 1880000
                  duration_hours: 227
                  points_reward: 100
                  message: Заявка выиграна. Заказ ещё не доставлен.
              order_lost:
                value:
                  event: order_lost
                  order_id: ord_6010
                  request_id: req_5004
                  team_id: team-1
                  route_id: road:novosibirsk-tomsk
                  leg_ids: [road:novosibirsk-tomsk]
                  reason: not_selected
                  message: 'Заявка закрыта: выбрана другая котировка.'
      responses:
        '204':
          description: |
            Уведомление принято (в том числе повтор с тем же ключом и телом).
            Тела нет; команда статус заказа не меняет.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: |
            Заказ не найден или чужой — без различия. Для `order_won` и
            `order_lost` тот же код означает «уведомления не поддерживаются»
            (вместе с `405` и `501`); портал помечает доставку `failed`, но
            выбор, заказ и резерв не откатываются.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '405':
          description: |
            Ручка не поддерживается (альтернатива `404`/`501`). Портал помечает
            доставку `failed`, награда не откатывается.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '501':
          description: |
            Уведомления не реализованы (альтернатива `404`/`405`). Портал
            помечает доставку `failed`, награда не откатывается.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /v1/points:
    get:
      tags: [Points]
      operationId: listPoints
      summary: Баллы команды
      description: |
        Read-only история `order_delivery` и `subcontract_delivery` только своей
        команды; запись делает системный settlement, ручек записи нет.
      responses:
        '200':
          description: Баллы команды.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PointsEntry'}
              examples:
                list:
                  value:
                    - id: pts_9001
                      kind: order_delivery
                      order_id: ord_6003
                      amount_points: 100
                      created_at: '2026-11-17T03:40:00Z'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: 'Ключ команды: только TLS, constant-time, не логируется и не возвращается.'

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Ключ `<request_id>:<team_slug>`; повтор возвращает тот же результат.'
      schema:
        type: string
        pattern: '^req_[A-Za-z0-9]{2,32}:[a-z0-9-]{1,64}$'
    NotifyIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Ключ доставки уведомления. Для `order_won` —
        `exchange:order:<order_id>:won:v1`, для `order_lost` —
        `exchange:order:<order_id>:lost:<team_id>:v1`; портал передаёт его
        всегда, и сервис обязан трактовать эти события идемпотентно по ключу
        (повтор с тем же ключом и телом — `204`, другое тело — `409`).
        Для `delivered`/`subcontract_delivered` заголовок не обязателен:
        их идемпотентность — по паре `(order_id, subcontract_id)`.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9:_.-]{0,127}$'
    RequestId:
      name: request_id
      in: path
      required: true
      description: Идентификатор заявки.
      schema: {$ref: '#/components/schemas/RequestId'}
    OrderId:
      name: order_id
      in: path
      required: true
      description: Идентификатор заказа команды.
      schema: {$ref: '#/components/schemas/OrderId'}

  responses:
    BadRequest:
      description: Битое тело или обязательный заголовок отсутствует.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Ключ API отсутствует или неверен.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Объект не найден или принадлежит другой команде.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: |
        `request_conflict`, `quote_exists`, `request_closed`,
        `notification_conflict`. Для событий `order_won`/`order_lost` `409`
        означает «уже обработано» и трактуется порталом как успех.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationError:
      description: Тело или параметры не прошли проверку.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ServiceUnavailable:
      description: БД или зависимость недоступны; повтор с паузой.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  schemas:
    Health:
      type: object
      description: 'Ответ ручки /healthz: процесс жив и готов принимать трафик.'
      required: [status, version]
      additionalProperties: false
      properties:
        status: {type: string, enum: [ok]}
        service: {type: string, examples: [team-service]}
        version: {type: string, examples: ['2.4.0']}
        time: {type: string, format: date-time, examples: ['2026-11-17T06:40:00Z']}

    Error:
      type: object
      description: 'Единый конверт ошибок: code, message, details.'
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          description: Машиночитаемый код (не enum — совместимость вперёд).
        message:
          type: string
          description: Описание для человека, без секретов и внутренних деталей.
        details:
          type: object
          additionalProperties: true
          description: Машиночитаемые подробности (поля, причина, ресурс).

    RequestId: {type: string, pattern: '^req_[A-Za-z0-9]{2,32}$', examples: [req_5001]}
    QuoteId: {type: string, pattern: '^quo_[A-Za-z0-9]{2,32}$', examples: [quo_7001]}
    OrderId: {type: string, pattern: '^ord_[A-Za-z0-9]{2,32}$', examples: [ord_6003]}
    SubcontractId: {type: string, pattern: '^sub_[A-Za-z0-9]{2,32}$', examples: [sub_9001]}
    RouteId: {type: string, pattern: '^[a-z][a-z0-9_]*:[a-z0-9]+(?:-[a-z0-9]+)*-[a-z0-9]+(?:-[a-z0-9]+)*$', examples: [road:moscow-kazan]}
    LegId: {type: string, pattern: '^[a-z][a-z0-9_]*:[a-z0-9]+(?:-[a-z0-9]+)*-[a-z0-9]+(?:-[a-z0-9]+)*$', examples: [road:moscow-kazan]}
    LocationId: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', examples: [moscow]}
    ModeId: {type: string, enum: [road, rail, air, sea], examples: [rail]}

    RequestStatus:
      type: string
      readOnly: true
      description: |
        open/quoted/closed/expired/cancelled. Эталон профиля статус заявки не
        задаёт — множество сохранено из текущего контракта.
      enum: [open, quoted, closed, expired, cancelled]

    QuoteStatus:
      type: string
      readOnly: true
      description: 'submitted/accepted/lost/expired.'
      enum: [submitted, accepted, lost, expired]

    QuoteVariant:
      type: string
      description: |
        Вариант котировки: `cheapest` — самый дешёвый, `fastest` — самый
        быстрый, `balanced` — сбалансированный. Это подсказка: ranking и
        выбор делает портал по своей политике, поле на него не влияет.
      enum: [cheapest, fastest, balanced]

    OrderStatus:
      type: string
      readOnly: true
      description: 'Системный статус доставки; delivered и failed терминальны.'
      enum: [confirmed, in_transit, delivered, failed]

    Cargo:
      type: object
      description: Описание груза.
      required: [description]
      additionalProperties: false
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 500
        cargo_type:
          type: string
          enum: [general, fragile, refrigerated, hazardous, oversized]
          default: general

    RouteHint:
      type: object
      description: 'Подсказка портала, не разрешение: маршрут и плечи команда проверяет сама.'
      required: [route_id]
      additionalProperties: false
      properties:
        route_id: {$ref: '#/components/schemas/RouteId'}
        leg_ids:
          type: array
          items: {$ref: '#/components/schemas/LegId'}

    Request:
      type: object
      description: 'Входящий RFQ, а не заказ: команда не создаёт заказ и не меняет статус.'
      required:
        [request_id, origin, destination, weight_t, cargo,
         response_deadline, points_reward]
      additionalProperties: false
      properties:
        request_id: {$ref: '#/components/schemas/RequestId'}
        origin: {$ref: '#/components/schemas/LocationId'}
        destination: {$ref: '#/components/schemas/LocationId'}
        allowed_modes:
          type: array
          minItems: 1
          uniqueItems: true
          description: Способы, которыми портал разрешает везти.
          items: {$ref: '#/components/schemas/ModeId'}
        weight_t:
          type: number
          minimum: 0.001
          description: Масса груза, тонны.
        cargo: {$ref: '#/components/schemas/Cargo'}
        response_deadline:
          type: string
          format: date-time
          description: |
            До этого момента принимаются котировки (UTC). После дедлайна
            котировка отклоняется `409 request_closed`.
        points_reward:
          type: integer
          minimum: 1
          maximum: 10000
          description: Баллы за системную доставку заказа.
        route_hints:
          type: array
          maxItems: 6
          items: {$ref: '#/components/schemas/RouteHint'}
        max_price_rub:
          type: integer
          minimum: 1
          description: |
            Потолок цены заявки, ₽. Котировка дороже порталом не допускается
            (`price_above_ceiling`); нет поля — потолка нет.
        max_duration_hours:
          type: number
          minimum: 0.01
          maximum: 100000
          description: |
            Потолок срока заявки, ч. Котировка медленнее порталом не
            допускается (`duration_above_target`); нет поля — потолка нет.
        comment:
          type: string
          maxLength: 1000
        received_at:
          type: string
          format: date-time
          readOnly: true
          description: Время приёма заявки командой (UTC).
        status:
          allOf:
            - $ref: '#/components/schemas/RequestStatus'
          readOnly: true

    QuoteInput:
      type: object
      description: |
        Вариант котировки без себестоимости; `valid_until` — RFC 3339, не
        раньше `response_deadline + 60 s`.
      required:
        [quote_id, variant, price_rub, duration_hours, route_id, leg_ids, valid_until]
      additionalProperties: false
      properties:
        quote_id: {$ref: '#/components/schemas/QuoteId'}
        variant: {$ref: '#/components/schemas/QuoteVariant'}
        price_rub:
          type: integer
          minimum: 1
          description: Цена перевозки целиком, целые рубли.
        duration_hours:
          type: number
          minimum: 0.01
          description: Срок доставки, часы.
        route_id: {$ref: '#/components/schemas/RouteId'}
        leg_ids:
          type: array
          minItems: 1
          description: Свои плечи маршрута.
          items: {$ref: '#/components/schemas/LegId'}
        valid_until:
          type: string
          format: date-time
          description: Момент, после которого котировка недействительна.
        comment:
          type: string
          maxLength: 1000

    QuoteBatchInput:
      type: object
      description: |
        Набор вариантов котировки одной команды по заявке: от одного до трёх.
        `variant` и `quote_id` уникальны внутри набора. Повтор публикации —
        `409 quote_exists`; замена и отзыв не предусмотрены.
      required: [variants]
      additionalProperties: false
      properties:
        variants:
          type: array
          minItems: 1
          maxItems: 3
          description: До трёх вариантов; порядок в массиве не задаёт приоритет выбора.
          items: {$ref: '#/components/schemas/QuoteInput'}

    Quote:
      type: object
      description: 'Принятый вариант котировки; status, received_seq и received_at — серверные.'
      required:
        [quote_id, request_id, variant, status, price_rub, duration_hours, route_id,
         leg_ids, valid_until, received_seq, received_at]
      additionalProperties: false
      properties:
        quote_id: {$ref: '#/components/schemas/QuoteId'}
        request_id: {$ref: '#/components/schemas/RequestId'}
        variant: {$ref: '#/components/schemas/QuoteVariant'}
        status:
          allOf:
            - $ref: '#/components/schemas/QuoteStatus'
          readOnly: true
        price_rub:
          type: integer
          minimum: 1
        duration_hours:
          type: number
          minimum: 0.01
        route_id: {$ref: '#/components/schemas/RouteId'}
        leg_ids:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/LegId'}
        valid_until:
          type: string
          format: date-time
        received_seq:
          type: integer
          minimum: 1
          readOnly: true
          description: Серверный монотонный номер приёма.
        received_at:
          type: string
          format: date-time
          readOnly: true
        comment:
          type: string
          maxLength: 1000

    QuoteBatch:
      type: object
      description: Набор принятых котировок; серверные поля у каждого варианта.
      required: [request_id, variants]
      additionalProperties: false
      properties:
        request_id: {$ref: '#/components/schemas/RequestId'}
        variants:
          type: array
          minItems: 1
          maxItems: 3
          items: {$ref: '#/components/schemas/Quote'}

    OrderSnapshot:
      type: object
      description: |
        Read-only снимок; `status`, `delivered_at`, `failed_at`, `failure_code` и
        `points_awarded` — системные, `delivered`/`failed` терминальны.
      required: [order_id, request_id, route_id, status, price_rub, created_at]
      additionalProperties: false
      properties:
        order_id: {$ref: '#/components/schemas/OrderId'}
        request_id: {$ref: '#/components/schemas/RequestId'}
        quote_id: {$ref: '#/components/schemas/QuoteId'}
        route_id: {$ref: '#/components/schemas/RouteId'}
        status:
          allOf:
            - $ref: '#/components/schemas/OrderStatus'
          readOnly: true
        price_rub:
          type: integer
          minimum: 1
          description: Цена заказа команды, целые рубли.
        created_at:
          type: string
          format: date-time
        delivered_at:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: Системное время доставки; присутствует только у `delivered`.
        failed_at:
          type: [string, 'null']
          format: date-time
          readOnly: true
          description: Системное время срыва; присутствует только у `failed`.
        failure_code:
          type: [string, 'null']
          readOnly: true
          pattern: '^[a-z][a-z0-9_]{2,31}$'
          description: Системный код срыва; присутствует только у `failed`.
        points_awarded:
          type: integer
          minimum: 0
          readOnly: true
          description: Баллы, начисленные команде за доставку; не отрицательные.
      allOf:
        - if:
            properties:
              status:
                const: delivered
            required: [status]
          then:
            required: [delivered_at]
        - if:
            properties:
              status:
                const: failed
            required: [status]
          then:
            required: [failed_at, failure_code]

    OrderNotification:
      type: object
      description: |
        Входящий факт системной доставки; идемпотентность — по
        `(order_id, subcontract_id)`. Полей смены статуса, отмены или
        подтверждения доставки нет.
      required: [order_id, status, delivered_at, route_id, leg_ids, points_awarded]
      additionalProperties: false
      properties:
        order_id: {$ref: '#/components/schemas/OrderId'}
        subcontract_id:
          $ref: '#/components/schemas/SubcontractId'
        status:
          type: string
          description: |
            Тип системного события. `delivered` — заказ доставлен;
            `subcontract_delivered` — доставлено чужое плечо.
          enum: [delivered, subcontract_delivered]
        delivered_at:
          type: string
          format: date-time
          description: Системное время доставки.
        route_id: {$ref: '#/components/schemas/RouteId'}
        leg_ids:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/LegId'}
        points_awarded:
          type: integer
          minimum: 0
          description: Баллы, начисленные системой; не отрицательные.

    OrderWonNotification:
      type: object
      description: |
        Уведомление о победе в заявке (`event: order_won`). Это снимок решения,
        а не заказа: статус и доставку команда получает событиями
        `delivered`/`subcontract_delivered`. `team_id` — команда-победитель;
        `points_reward` — обещанная награда заявки, а не начисленные баллы
        (начисление будет только после доставки). `message` — человекочитаемая
        строка для UI команды, не для разбора.
      required:
        [event, order_id, request_id, team_id, route_id, leg_ids, price_rub,
         duration_hours, points_reward, message]
      additionalProperties: false
      properties:
        event:
          type: string
          const: order_won
          description: Тип события.
        order_id: {$ref: '#/components/schemas/OrderId'}
        request_id: {$ref: '#/components/schemas/RequestId'}
        team_id:
          type: string
          pattern: '^[a-z0-9-]{1,64}$'
          examples: [team-1]
          description: Команда-победитель (slug).
        route_id: {$ref: '#/components/schemas/RouteId'}
        leg_ids:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/LegId'}
        price_rub:
          type: integer
          minimum: 1
          description: Цена выигравшей котировки, целые рубли.
        duration_hours:
          type: number
          minimum: 0.01
          description: Срок доставки выигравшей котировки, часы.
        points_reward:
          type: integer
          minimum: 1
          maximum: 10000
          description: Обещанная награда заявки, не начисленные баллы.
        message:
          type: string
          minLength: 1
          maxLength: 500

    OrderLostReason:
      type: string
      description: |
        Причина закрытия заявки без победы: `not_selected` — котировка подана,
        но выбрали другую; `no_quote` — RFQ получен, котировка не подана.
      enum: [not_selected, no_quote]

    OrderLostNotification:
      type: object
      description: |
        Экспериментальное уведомление `event: order_lost`: заявка закрыта без
        победы команды. Событие не входит в базовый контракт — портал может
        выключить его без изменения контракта; сервис обязан ответить `204` и
        не падать, если событие не приходит.
      required:
        [event, order_id, request_id, team_id, route_id, leg_ids, reason, message]
      additionalProperties: false
      properties:
        event:
          type: string
          const: order_lost
          description: Тип события.
        order_id: {$ref: '#/components/schemas/OrderId'}
        request_id: {$ref: '#/components/schemas/RequestId'}
        team_id:
          type: string
          pattern: '^[a-z0-9-]{1,64}$'
          examples: [team-1]
          description: Команда-получатель события (slug).
        route_id: {$ref: '#/components/schemas/RouteId'}
        leg_ids:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/LegId'}
        reason: {$ref: '#/components/schemas/OrderLostReason'}
        message:
          type: string
          minLength: 1
          maxLength: 500

    PointsEntry:
      type: object
      description: |
        Начисление баллов (только свои): `order_delivery` — свой заказ,
        `subcontract_delivery` — opaque-субподряд портала.
      required: [id, kind, amount_points, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^pts_[A-Za-z0-9]{2,32}$'
          description: Идентификатор балльной транзакции.
        kind:
          type: string
          enum: [order_delivery, subcontract_delivery]
        order_id: {$ref: '#/components/schemas/OrderId'}
        subcontract_id: {$ref: '#/components/schemas/SubcontractId'}
        amount_points:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
      allOf:
        - if:
            properties:
              kind:
                const: order_delivery
            required: [kind]
          then:
            required: [order_id]
        - if:
            properties:
              kind:
                const: subcontract_delivery
            required: [kind]
          then:
            required: [subcontract_id]
