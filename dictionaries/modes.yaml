description: >
  Способы перевозки. Их ровно четыре: road, rail, air, sea.
  Никакой техники, грузоподъёмности и условий груза здесь нет намеренно:
  заявка несёт только вес и список разрешённых способов, а чем именно
  везти — решает перевозчик.

modes:
