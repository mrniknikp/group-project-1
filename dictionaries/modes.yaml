  - id: rail
    name_ru: Железная дорога
    name_en: Rail
    description: Перевозка по железнодорожной сети.

  - id: air
    name_ru: Авиатранспорт
    name_en: Air
    description: Перевозка воздушным транспортом.

  - id: sea
    name_ru: Водный транспорт
    name_en: Sea
    description: Морские и речные перевозки.
