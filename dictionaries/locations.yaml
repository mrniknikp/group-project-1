description: >
  Справочник локаций (городов), между которыми могут выполняться перевозки.
  Координаты — WGS84, десятичные градусы. Инфраструктурные флаги показывают,
  какие виды транспорта физически доступны в локации.
  port — порт (морской или речной/озёрный, без разделения),
  airport — аэропорт, railway — железнодорожная станция,
  road_access — подъезд автомобильным транспортом.

