description: >
  Сеть морских и внутренних водных сегментов между портами.
  Длинные маршруты разбиты по узловым портам (Роттердам, Гамбург,
  Стамбул, Каир/Суэц, Дубай, Мумбаи, Сингапур, Шанхай, Владивосток,
  Нью-Йорк, Лос-Анджелес и др.). Итоговый маршрут A→B собирается
  как путь по графу; distance_km учитывает реальные морские пути
  через проливы и каналы, а не расстояние по прямой.
  Время: distance/30 + 12 ч. Стоимость: 5000 + 2 RUB за тонно-км.
