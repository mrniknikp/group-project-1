schema_version: 3
updated: 2026-11-11
mode: air
max_distance_km: 10000
distance_unit: km
duration_unit: h
cost_unit: RUB/ton
bidirectional: true
description: >
  Hub-and-spoke k=2: каждый не-хаб подключён к двум ближайшим хабам.
  Хаб-сеть прорежена: прямая связь оставлена, только если объезд
  через другой хаб не длиннее более чем на 10%. Полёты короче 300 км
  исключены — для них используется наземный транспорт.
  distance_km — расстояние по большой окружности (прямая по воздуху).
  Время: distance/800 + 2 ч. Стоимость: 30000 + 90 RUB за тонно-км.
